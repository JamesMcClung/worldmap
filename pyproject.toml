[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmap"
version = "0.1.0"
description = "Poster-sized political world map PNG with non-overlapping country labels"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James McClung" }]
requires-python = ">=3.10"
dependencies = [
    "contourpy>=1.2",  # topographic contours (also a matplotlib dependency)
    "geopandas>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pillow>=10",
    "pyogrio>=0.7",
    "pyproj>=3.6",
    "questionary>=2.0",  # --crop: choose among the labels a name matches
    "rasterio>=1.4",  # reads the ETOPO (--type topographic) and land-cover (--color earth) GeoTIFFs
    "shapely>=2.1",  # maximum_inscribed_circle
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 4 workers: two topographic renders (3.3 and 5 GB peak) may run at once beside the political ones (~0.5 GB);
# each xdist_group runs on one worker. -n0 runs serially.
addopts = "-n 4 --dist loadgroup"

[tool.mypy]
ignore_missing_imports = true  # geopandas, shapely, pyproj ship no stubs

[project.scripts]
make_map = "worldmap.cli:main"
